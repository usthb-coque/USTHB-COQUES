<!doctype html>
<html lang="fr">

<head>

<meta charset="utf-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1"
>

<title>USTHB Cases</title>

<style>

/* =========================
   GENERAL
========================= */

*{
  box-sizing:border-box;
}

body{
  font-family:Arial,sans-serif;
  margin:0;
  background:#fff7fb;
  color:#4b3040;
}


/* =========================
   HEADER
========================= */

header{
  background:#fff;
  padding:18px;
  position:sticky;
  top:0;
  z-index:10;
  box-shadow:0 2px 12px #ead2dc;
}

.brand{
  text-align:center;
  font-size:28px;
  color:#d94f8b;
  font-weight:bold;
  margin-bottom:14px;
}


/* =========================
   CATEGORIES
========================= */

.cats{
  display:flex;
  justify-content:center;
  gap:8px;
  overflow:auto;
}

.cat{
  border:0;
  background:#fff0f6;
  color:#6d4a5b;
  padding:10px 16px;
  border-radius:999px;
  font-weight:bold;
  white-space:nowrap;
  cursor:pointer;
}

.cat.active{
  background:#d94f8b;
  color:#fff;
}


/* =========================
   ADMIN
========================= */

.admin-logo{
  position:absolute;
  right:14px;
  top:12px;
  width:46px;
  height:46px;
  border-radius:50%;
  background:linear-gradient(
    145deg,
    #fff,
    #ffe1ed
  );
  color:#d94f8b;
  text-decoration:none;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:25px;
  border:2px solid #f4b7cf;
  box-shadow:0 3px 10px #edbfd2;
}



/* =========================
   SEARCH
========================= */

.search{
  display:block;
  width:calc(100% - 40px);
  max-width:900px;
  margin:18px auto;
  padding:14px 16px;
  border:1px solid #efb5cc;
  border-radius:14px;
  outline:none;
  font-size:16px;
  background:#fff;
}

.search:focus{
  border-color:#d94f8b;
  box-shadow:0 0 0 3px #fbe0eb;
}


/* =========================
   PRODUCTS
========================= */

.grid{
  padding:20px;
  max-width:1100px;
  margin:auto;
  display:grid;
  grid-template-columns:
    repeat(
      auto-fill,
      minmax(180px,1fr)
    );
  gap:18px;
}

.card{
  background:white;
  padding:10px;
  border-radius:18px;
  box-shadow:0 3px 15px #edd7e0;
  cursor:pointer;
  transition:.2s;
}

.card:hover{
  transform:translateY(-3px);
}

.card img{
  width:100%;
  aspect-ratio:1;
  object-fit:cover;
  border-radius:14px;
  background:#fff0f6;
}

.card h3{
  margin:10px 3px 6px;
}

.price{
  margin:0 3px 5px;
  color:#d94f8b;
  font-weight:bold;
}

.product-model{
  font-size:13px;
  color:#777;
  margin:0 3px 7px;
  line-height:1.4;
}

.empty{
  text-align:center;
  grid-column:1/-1;
  padding:50px;
}


/* =========================
   MODALS
========================= */

.modal{
  position:fixed;
  inset:0;
  background:#0008;
  display:none;
  align-items:center;
  justify-content:center;
  padding:15px;
  z-index:30;
}

.modal.show{
  display:flex;
}

.modalbox{
  background:#fff7fb;
  padding:22px;
  border-radius:22px;
  width:100%;
  max-width:650px;
  max-height:94vh;
  overflow:auto;
}


/* =========================
   DETAILS
========================= */

.detail-image{
  display:block;
  width:250px;
  height:250px;
  object-fit:contain;
  margin:auto;
  border-radius:15px;
  cursor:zoom-in;
  background:#fff;
}

.gallery{
  display:flex;
  gap:8px;
  justify-content:center;
  flex-wrap:wrap;
  margin-top:10px;
}

.gallery img{
  width:60px;
  height:60px;
  object-fit:cover;
  border-radius:10px;
  cursor:pointer;
}


/* =========================
   MODELES
========================= */

.model{
  border:0;
  background:#d94f8b;
  color:#fff;
  padding:11px 14px;
  border-radius:12px;
  font-weight:bold;
  margin:4px;
  cursor:pointer;
}

.model.selected{
  background:#8d2d59;
  box-shadow:
    0 0 0 3px #f5a7c8;
}


/* =========================
   BUTTONS
========================= */

.btn{
  width:100%;
  border:0;
  background:#d94f8b;
  color:#fff;
  padding:13px;
  border-radius:12px;
  font-weight:bold;
  cursor:pointer;
  margin-top:12px;
}

.btn:hover{
  background:#c43d78;
}


/* =========================
   FORM
========================= */

.field{
  width:100%;
  padding:12px;
  margin:6px 0;
  border:1px solid #efb0ca;
  border-radius:12px;
  outline:none;
  font-size:15px;
}

.field:focus{
  border-color:#d94f8b;
}

textarea.field{
  min-height:90px;
  resize:vertical;
}

.hidden{
  display:none!important;
}


/* =========================
   SUMMARY
========================= */

.summary{
  background:#fff;
  padding:13px;
  border-radius:14px;
  margin:8px 0;
  line-height:1.7;
}

.total{
  color:#d94f8b;
  font-weight:bold;
  font-size:18px;
}


/* =========================
   CLOSE
========================= */

.close{
  float:right;
  border:0;
  background:#fff;
  border-radius:50%;
  font-size:22px;
  width:34px;
  height:34px;
  cursor:pointer;
}


/* =========================
   LIGHTBOX
========================= */

.lightbox{
  position:fixed;
  inset:0;
  background:#000d;
  display:none;
  align-items:center;
  justify-content:center;
  z-index:50;
  padding:20px;
}

.lightbox.show{
  display:flex;
}

.lightbox img{
  max-width:90vw;
  max-height:88vh;
  object-fit:contain;
}


/* =========================
   DELIVERY
========================= */

.ship-options{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
}

.ship{
  background:#fff;
  border:2px solid #f0c0d2;
  padding:12px;
  border-radius:12px;
  cursor:pointer;
}

.ship:has(input:checked){
  border-color:#d94f8b;
  background:#fff0f6;
}


/* =========================
   MESSAGES
========================= */

.message-success{
  background:#e8fff0;
  color:#237344;
  padding:15px;
  border-radius:14px;
  margin-top:12px;
  font-weight:bold;
}

.message-error{
  background:#ffe6ee;
  color:#9b3159;
  padding:15px;
  border-radius:14px;
  margin-top:12px;
  font-weight:bold;
  word-break:break-word;
}


/* =========================
   EPUISE
========================= */
.card.sold-out{
  opacity:.72;
  position:relative;
}

.sold-badge{
  display:inline-block;
  margin-top:8px;
  padding:7px 11px;
  border-radius:999px;
  background:#222;
  color:#fff;
  font-size:12px;
  font-weight:800;
  letter-spacing:.5px;
}

.btn[disabled]{
  opacity:.55;
  cursor:not-allowed;
}

/* =========================
   MOBILE
========================= */

@media(max-width:500px){

  .brand{
    font-size:24px;
  }

  .grid{
    grid-template-columns:
      repeat(2,1fr);
    gap:12px;
    padding:12px;
  }

  .card{
    padding:8px;
  }

  .detail-image{
    width:210px;
    height:210px;
  }

  .ship-options{
    grid-template-columns:1fr;
  }

  .search{
    width:calc(100% - 24px);
  }

}

</style>

</head>


<body>


<!-- =========================
     HEADER
========================= -->

<header>

<a
  class="admin-logo"
  href="admin.html"
  aria-label="Admin"
  title="Admin"
>
  👩‍💼
</a>

<div class="brand">
  USTHB CASES
</div>


<nav class="cats">

<button
  class="cat active"
  data-cat="cases"
>
  CASES
</button>

<button
  class="cat"
  data-cat="accessoires"
>
  ACCESSOIRES
</button>

<button
  class="cat"
  data-cat="ventouses"
>
  VENTOUSES
</button>

<button
  class="cat"
  data-cat="ipad"
>
  IPAD
</button>

</nav>

</header>



<!-- =========================
     SEARCH
========================= -->

<input
  id="search"
  class="search"
  type="search"
  placeholder="🔎 Rechercher un téléphone ou un modèle : iPhone 13..."
  autocomplete="off"
>



<!-- =========================
     PRODUCTS
========================= -->

<main
  id="products"
  class="grid"
>

<div class="empty">
  Chargement…
</div>

</main>



<!-- =========================
     DETAILS
========================= -->

<div
  id="details"
  class="modal"
>

<div class="modalbox">

<button
  class="close"
  onclick="closeDetails()"
>
  ×
</button>

<div id="detailContent"></div>

</div>

</div>



<!-- =========================
     COMMANDE
========================= -->

<div
  id="order"
  class="modal"
>

<div class="modalbox">

<button
  class="close"
  onclick="closeOrder()"
>
  ×
</button>


<h2>
  🛍️ Commander
</h2>


<div
  id="orderProduct"
  class="summary"
>
</div>



<form id="orderForm">


<input
  id="firstName"
  class="field"
  placeholder="Nom"
  required
>


<input
  id="lastName"
  class="field"
  placeholder="Prénom"
  required
>


<input
  id="phone"
  class="field"
  type="tel"
  inputmode="numeric"
  pattern="[0-9]{10}"
  minlength="10"
  maxlength="10"
  placeholder="Numéro de téléphone (10 chiffres)"
  title="Le numéro doit contenir exactement 10 chiffres"
  required
>


<select
  id="wilaya"
  class="field"
  required
>

<option value="">
  Choisir la wilaya
</option>

</select>



<h3>
  📦 Livraison
</h3>


<div class="ship-options">


<label class="ship">

<input
  type="radio"
  name="delivery"
  value="Domicile"
  required
>

Domicile

</label>


<label class="ship">

<input
  type="radio"
  name="delivery"
  value="Bureau"
>

Bureau (Stop Desk)

</label>


<label class="ship">

<input
  type="radio"
  name="delivery"
  value="USTHB"
>

USTHB

</label>


</div>



<textarea
  id="address"
  class="field hidden"
  placeholder="Adresse complète"
></textarea>



<div class="summary">

Produit :
<b id="productTotal"></b>

<br>

Livraison :
<b id="deliveryCost">—</b>

<br>

<span class="total">

Total :
<span id="grandTotal">—</span>

</span>

</div>



<button
  class="btn"
  type="submit"
>

Confirmer la commande

</button>


</form>



<div
  id="orderMsg"
  class="hidden"
>
</div>


</div>

</div>



<!-- =========================
     LIGHTBOX
========================= -->

<div
  id="lightbox"
  class="lightbox"
  onclick="closeLightbox()"
>

<img
  id="lightImage"
  alt=""
>

</div>



<!-- =========================
     SUPABASE
========================= -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>


/* =========================
   SUPABASE
========================= */

const db = supabase.createClient(

  'https://sydurxdeqjgyuzvotmth.supabase.co',

  'sb_publishable_YtZkRYlml5U_6OtOKcnnyQ_smF0CELK'

);



/* =========================
   VARIABLES
========================= */

let all = [];

let current = null;

let selectedModel = null;

let activeCat = 'cases';



/* =========================
   HELPERS
========================= */

const $ = id =>
  document.getElementById(id);



const esc = s =>
  String(s ?? '').replace(
    /[&<>"']/g,
    c => ({
      '&':'&amp;',
      '<':'&lt;',
      '>':'&gt;',
      '"':'&quot;',
      "'":'&#39;'
    }[c])
  );



const money = n =>

  Number(n || 0)
    .toLocaleString('fr-DZ')
    + ' DA';



/* =========================
   IMAGES
========================= */

const imgs = v =>

  String(v || '')
    .split('||')
    .map(x => x.trim())
    .filter(Boolean);



/* =========================
   MODELES
========================= */

const models = v =>

  String(v || '')
    .split('||')
    .map(x => x.trim())
    .filter(Boolean);



/* =========================
   WILAYAS
========================= */

const wilayas = [

'Adrar',
'Chlef',
'Laghouat',
'Oum El Bouaghi',
'Batna',
'Béjaïa',
'Biskra',
'Béchar',
'Blida',
'Bouira',
'Tamanrasset',
'Tébessa',
'Tlemcen',
'Tiaret',
'Tizi Ouzou',
'Alger',
'Djelfa',
'Jijel',
'Sétif',
'Saïda',
'Skikda',
'Sidi Bel Abbès',
'Annaba',
'Guelma',
'Constantine',
'Médéa',
'Mostaganem',
'M’Sila',
'Mascara',
'Ouargla',
'Oran',
'El Bayadh',
'Illizi',
'Bordj Bou Arreridj',
'Boumerdès',
'El Tarf',
'Tindouf',
'Tissemsilt',
'El Oued',
'Khenchela',
'Souk Ahras',
'Tipaza',
'Mila',
'Aïn Defla',
'Naâma',
'Aïn Témouchent',
'Ghardaïa',
'Relizane',
'Timimoun',
'Bordj Badji Mokhtar',
'Ouled Djellal',
'Beni Abbes',
'In Salah',
'In Guezzam',
'Touggourt',
'Djanet',
'El M’Ghair',
'El Meniaa'

];



/* =========================
   FRAIS DOMICILE
========================= */

const domicile = [

1200,750,800,750,750,750,800,1200,650,750,
1900,800,750,750,750,500,800,750,750,800,
750,750,750,750,750,750,750,750,750,850,
750,850,2000,750,750,750,1600,750,850,750,
750,650,750,750,850,750,850,750,1450,2000,
850,1300,1800,2000,850,2000,850,950

];



/* =========================
   FRAIS BUREAU
========================= */

const bureau = [

800,450,500,450,450,450,500,800,450,450,
1300,500,500,450,450,350,450,450,450,450,
450,450,450,450,450,450,450,450,500,600,
450,450,1300,450,450,500,1000,500,500,450,
550,500,450,450,600,500,600,500,1000,1300,
500,900,1100,1300,600,1300,500,600

];



/* =========================
   REMPLIR WILAYAS
========================= */

wilayas.forEach((w,i) => {

  $('wilaya').insertAdjacentHTML(

    'beforeend',

    `<option value="${i}">
      ${esc(w)}
    </option>`

  );

});



/* =========================
   CHARGER PRODUITS
========================= */

async function load(){

  $('products').innerHTML =
    '<div class="empty">Chargement…</div>';


  const r = await db

    .from('coques')

    .select('*')

    .order(
      'created_at',
      {ascending:false}
    );


  if(r.error){

    console.error(
      'ERREUR PRODUITS:',
      r.error
    );


    $('products').innerHTML =

      '<div class="empty">' +

      '❌ Erreur de chargement<br><br>' +

      esc(r.error.message) +

      '</div>';

    return;

  }


  all = r.data || [];

  /* =========================
     STATUT ÉPUISÉ MANUEL

     Le statut vient uniquement
     de la colonne coques.epuise.
     Les commandes ne sont jamais
     lues, modifiées ou supprimées ici.
  ========================= */
  all = all.map(p => ({
    ...p,
    epuise: p.epuise === true
  }));

  console.log(
    'Produits chargés:',
    all
  );

  render();

}



/* =========================
   CATEGORIE
========================= */

function category(p){

  return String(

    p.categorie ||
    p.category ||
    'cases'

  )
  .trim()
  .toLowerCase();

}



/* =========================
   RECHERCHE
========================= */

function render(){

  const q =

    $('search')
      .value
      .toLowerCase()
      .trim();


  const result = all.filter(p => {


    /* catégorie */

    if(
      category(p) !== activeCat
    ){

      return false;

    }


    /* aucune recherche */

    if(!q){

      return true;

    }


    /* NOM */

    const nom =

      String(
        p.nom || ''
      )
      .toLowerCase();


    /* MODELE */

    const modele =

      String(
        p.modele || ''
      )
      .toLowerCase();


    /* TELEPHONE */

    const telephone =

      String(
        p.telephone ||
        p.phone ||
        p.compatibilite ||
        p.compatibility ||
        ''
      )
      .toLowerCase();


    /*
      RECHERCHE SUR :

      iPhone 13
      iphone 13
      IPHONE 13 PRO
      13
      nom produit
    */

    return (

      nom.includes(q) ||

      modele.includes(q) ||

      telephone.includes(q)

    );

  });



  if(!result.length){

    $('products').innerHTML = `

      <div class="empty">

        🔎 Aucun produit trouvé

        <br><br>

        Essayez par exemple :

        <br>

        <b>iPhone 13</b>

        <br>

        <b>iPhone 15 Pro Max</b>

      </div>

    `;

    return;

  }



  $('products').innerHTML =

    result.map(p => {


      const firstImage =
        imgs(p.image_url)[0] || '';


      return `

      <article

        class="card ${p.epuise ? 'sold-out' : ''}"

        onclick="openDetails('${esc(p.id)}')"

      >

        <img

          src="${esc(firstImage)}"

          alt="${esc(p.nom)}"

          onerror="this.style.display='none'"

        >


        <h3>

          ${esc(p.nom)}

        </h3>


        ${
          p.modele

          ?

          `

          <div class="product-model">

            📱

            ${esc(
              String(p.modele)
                .replaceAll(
                  '||',
                  ' • '
                )
            )}

          </div>

          `

          :

          ''

        }


        <div class="price">

          ${money(p.prix)}

        </div>

        ${
          p.epuise
          ? `
            <div class="sold-badge">
              ❌ ÉPUISÉ
            </div>
          `
          : ''
        }

      </article>

      `;

    })

    .join('');

}



/* =========================
   CATEGORIES
========================= */

document

.querySelectorAll('.cat')

.forEach(button => {


  button.onclick = () => {


    document

      .querySelectorAll('.cat')

      .forEach(x =>

        x.classList.remove(
          'active'
        )

      );


    button.classList.add(
      'active'
    );


    activeCat =
      button.dataset.cat;


    render();

  };

});



/* =========================
   LIGHTBOX
========================= */

function openLight(src,e){

  e?.stopPropagation();


  $('lightImage').src =
    src;


  $('lightbox')

    .classList

    .add('show');

}



function closeLightbox(){

  $('lightbox')

    .classList

    .remove('show');

}



/* =========================
   DETAILS
========================= */

function openDetails(id){


  current = all.find(

    p =>

      String(p.id) ===
      String(id)

  );


  if(!current){

    return;

  }


  selectedModel = null;


  const gallery =
    imgs(current.image_url);


  const isCase =

    category(current) ===
    'cases';


  const modelList =

    models(current.modele);



  $('detailContent').innerHTML = `


    <img

      class="detail-image"

      src="${esc(
        gallery[0] || ''
      )}"

      onclick="openLight(
        this.src,
        event
      )"

    >



    ${
      gallery.length > 1

      ?

      `

      <div class="gallery">

        ${

          gallery.map(image => `

            <img

              src="${esc(image)}"

              onclick="openLight(
                this.src,
                event
              )"

            >

          `).join('')

        }

      </div>

      `

      :

      ''

    }



    <h2>

      ${esc(current.nom)}

    </h2>



    <div class="price">

      ${money(current.prix)}

    </div>



    ${
      isCase

      ?

      `

      <h3>

        📱 Choisir le modèle

      </h3>


      <div>

        ${

          modelList.length

          ?

          modelList.map(
            (model,index) => `

              <button

                class="model"

                id="model-${index}"

                onclick="selectModel(
                  '${esc(model)}',
                  ${index}
                )"

              >

                ${esc(model)}

              </button>

            `
          ).join('')

          :

          `

          <p>

            Aucun modèle renseigné.

          </p>

          `

        }

      </div>

      `

      :

      ''

    }



    <button

      class="btn"

      ${current.epuise ? 'disabled' : 'onclick="openOrder(event)"'}

    >

      ${current.epuise ? '❌ ÉPUISÉ' : '🛍️ COMMANDER'}

    </button>


  `;



  $('details')

    .classList

    .add('show');

}



/* =========================
   SELECTION MODELE
========================= */

function selectModel(
  model,
  index
){

  selectedModel =
    model;


  document

    .querySelectorAll(
      '.model'
    )

    .forEach(button =>

      button.classList.remove(
        'selected'
      )

    );


  const button =

    document.getElementById(
      'model-' + index
    );


  if(button){

    button.classList.add(
      'selected'
    );

  }

}



/* =========================
   CLOSE DETAILS
========================= */

function closeDetails(){

  $('details')

    .classList

    .remove('show');

}



/* =========================
   OPEN ORDER
========================= */

function openOrder(e){

  e?.stopPropagation();


  if(!current){

    alert(
      'Produit introuvable.'
    );

    return;

  }


  if(current.epuise){
    alert('❌ Cet article est actuellement ÉPUISÉ.');
    return;
  }


  const isCase =

    category(current) ===
    'cases';


  const modelList =

    models(current.modele);


  if(

    isCase &&

    modelList.length > 0 &&

    !selectedModel

  ){

    alert(
      'Veuillez choisir le modèle du téléphone.'
    );

    return;

  }



  $('details')

    .classList

    .remove('show');



  $('orderProduct').innerHTML = `


    <b>

      ${esc(current.nom)}

    </b>


    ${

      selectedModel

      ?

      `

      <br>

      📱 Modèle :

      <b>

        ${esc(selectedModel)}

      </b>

      `

      :

      ''

    }


    <br>

    ${money(current.prix)}

  `;



  $('productTotal').textContent =

    money(current.prix);


  $('deliveryCost').textContent =
    '—';


  $('grandTotal').textContent =

    money(current.prix);


  $('orderMsg').className =
    'hidden';


  $('order')

    .classList

    .add('show');

}



/* =========================
   CLOSE ORDER
========================= */

function closeOrder(){

  $('order')

    .classList

    .remove('show');

}



/* =========================
   DELIVERY CHANGE
========================= */

document

.querySelectorAll(
  'input[name=delivery]'
)

.forEach(radio => {


  radio.onchange = () => {


    const delivery =

      document.querySelector(

        'input[name=delivery]:checked'

      )?.value;



    $('address')

      .classList

      .toggle(

        'hidden',

        delivery !==
        'Domicile'

      );


    updateTotal();

  };

});



/* =========================
   WILAYA CHANGE
========================= */

$('wilaya').onchange =
  updateTotal;



/* =========================
   CALCUL TOTAL
========================= */

function updateTotal(){


  const index =

    Number(
      $('wilaya').value
    );


  const delivery =

    document.querySelector(

      'input[name=delivery]:checked'

    )?.value;


  let cost = 0;



  if(

    delivery === 'Domicile' &&

    index >= 0

  ){

    cost =
      domicile[index] || 0;

  }



  else if(

    delivery === 'Bureau' &&

    index >= 0

  ){

    cost =
      bureau[index] || 0;

  }



  else if(

    delivery === 'USTHB'

  ){

    cost = 0;

  }



  $('deliveryCost').textContent =

    delivery
      ? money(cost)
      : '—';



  $('grandTotal').textContent =

    money(

      Number(
        current?.prix || 0
      )

      +

      cost

    );

}



/* =========================
   TELEPHONE : EXACTEMENT 10 CHIFFRES
========================= */

const phoneInput = document.getElementById('phone');

if(phoneInput){

  phoneInput.addEventListener('input', function(){

    this.value = this.value
      .replace(/\D/g, '')
      .slice(0, 10);

  });

}


/* =========================
   ENVOYER COMMANDE
========================= */

$('orderForm').onsubmit =

async function(e){

  e.preventDefault();



  if(!current){

    alert(
      'Produit introuvable.'
    );

    return;

  }



  const telephone = $('phone').value.trim();

  if(!/^\d{10}$/.test(telephone)){
    $('phone').setCustomValidity('Le numéro doit contenir exactement 10 chiffres.');
    $('phone').reportValidity();
    $('phone').setCustomValidity('');
    return;
  }


  const delivery =

    document.querySelector(

      'input[name=delivery]:checked'

    )?.value;



  if(!delivery){

    alert(
      'Choisissez le type de livraison.'
    );

    return;

  }



  const isCase =

    category(current) ===
    'cases';



  const modelList =

    models(current.modele);



  if(

    isCase &&

    modelList.length > 0 &&

    !selectedModel

  ){

    alert(
      'Veuillez choisir le modèle du téléphone.'
    );

    return;

  }



  if(

    delivery === 'Domicile' &&

    !$('address')
      .value
      .trim()

  ){

    alert(
      'Veuillez écrire votre adresse.'
    );

    return;

  }



  const index =

    Number(
      $('wilaya').value
    );



  if(

    !Number.isInteger(index) ||

    index < 0 ||

    index >= wilayas.length

  ){

    alert(
      'Choisissez votre wilaya.'
    );

    return;

  }



  let frais = 0;



  if(
    delivery === 'Domicile'
  ){

    frais =
      domicile[index] || 0;

  }



  if(
    delivery === 'Bureau'
  ){

    frais =
      bureau[index] || 0;

  }



  if(
    delivery === 'USTHB'
  ){

    frais = 0;

  }



  const total =

    Number(current.prix || 0)
    +
    frais;



  /* =========================
     PAYLOAD
     
     IMPORTANT :
     statut = En attente
  ========================= */

  const payload = {

    coque_id:
      current.id,


    modele:
      selectedModel ||


      (
        modelList.length

        ?

        modelList.join(' || ')

        :

        current.nom

      ),


    nom:

      $('firstName')
        .value
        .trim(),


    prenom:

      $('lastName')
        .value
        .trim(),


    telephone:
      telephone,


    adresse:

      delivery === 'Domicile'

      ?

      $('address')
        .value
        .trim()

      :

      wilayas[index],


    livraison:
      delivery,


    /*
      TON CHECK SUPABASE
      accepte uniquement :

      En attente
      Traitée
    */

    statut:
      'En attente',


    created_at:

      new Date()
        .toISOString()

  };



  console.log(
    '=============================='
  );

  console.log(
    'COMMANDE ENVOYEE'
  );

  console.log(
    payload
  );

  console.log(
    'TOTAL:',
    total
  );

  console.log(
    '=============================='
  );



  /* =========================
     INSERT
  ========================= */

  const r =

    await db

      .from('commandes')

      .insert([payload]);



  /* =========================
     ERREUR
  ========================= */

  if(r.error){

    console.error(
      'ERREUR SUPABASE:',
      r.error
    );


    $('orderMsg').className =
      'message-error';


    $('orderMsg').innerHTML =

      `

      ❌ Commande non enregistrée.

      <br><br>

      <b>Erreur Supabase :</b>

      <br>

      ${esc(
        r.error.message
      )}

      <br><br>

      <small>

      Code :
      ${esc(
        r.error.code || ''
      )}

      </small>

      `;

    return;

  }



  /* =====================================================
     PREMIER ARRIVÉ, PREMIER SERVI

     Le premier client qui commande un produit configuré
     dans ce mode le fait passer automatiquement à ÉPUISÉ.
     Les commandes précédentes ne sont jamais supprimées.
  ===================================================== */
  if(current.mode_stock === 'premier_arrive'){
    const stockUpdate = await db
      .from('coques')
      .update({epuise:true})
      .eq('id', current.id);

    if(stockUpdate.error){
      console.error('Impossible de marquer l’article épuisé:', stockUpdate.error);
    }
  }


  /* =========================
     SUCCES
  ========================= */

  $('orderMsg').className =
    'message-success';


  $('orderMsg').innerHTML =

    `

    ✅ Commande enregistrée avec succès !

    <br><br>

    📦 Statut :
    <b>En attente</b>

    <br><br>

    💗 Votre commande a bien été envoyée.

    ${current.mode_stock === 'premier_arrive'
      ? '<br><br>🥇 Premier arrivé, premier servi : cet article est maintenant épuisé.'
      : ''}

    `;



  /* =========================
     RESET
  ========================= */

  await load();

  $('orderForm').reset();


  $('address')

    .classList

    .add('hidden');


  selectedModel = null;



  /* =========================
     FERMER APRES 3 SEC
  ========================= */

  setTimeout(() => {


    closeOrder();


    $('orderMsg')

      .classList

      .add('hidden');


  },3000);

};




/* Numéro : chiffres uniquement, maximum 10 */
$('phone').addEventListener('input', function(){
  this.value = this.value.replace(/\D/g,'').slice(0,10);
});

/* =========================
   SEARCH
========================= */

$('search').oninput =
  render;



/* =========================
   START
========================= */

load();

</script>
