<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>USTHB Cases — Collection Luxe</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root {
  --primary: #d94f8b;
  --primary-hover: #c23d77;
  --primary-light: #fef0f5;
  --accent-gold: #d4af37;
  --dark-ink: #2b1b24;
  --muted-text: #7d6873;
  --bg-gradient: linear-gradient(180deg, #ffffff 0%, #fff7fa 50%, #fff0f5 100%);
  --card-bg: rgba(255, 255, 255, 0.9);
  --glass-border: rgba(239, 195, 212, 0.4);
  --shadow-sm: 0 4px 15px rgba(217, 79, 139, 0.05);
  --shadow-lg: 0 20px 40px rgba(67, 30, 48, 0.08);
  --radius-lg: 20px;
  --radius-md: 14px;
}

* {
  box-sizing: border-box;
  -webkit-font-smoothing: antialiased;
}

body {
  font-family: 'DM Sans', sans-serif;
  margin: 0;
  background: var(--bg-gradient);
  color: var(--dark-ink);
  min-height: 100vh;
}

/* =========================
   HEADER & NAVBAR
========================= */
header {
  background: rgba(255, 255, 255, 0.85);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  padding: 18px 24px;
  position: sticky;
  top: 0;
  z-index: 10;
  border-bottom: 1px solid var(--glass-border);
  box-shadow: var(--shadow-sm);
}

.header-top {
  text-align: center;
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 2px;
  color: var(--primary);
  font-weight: 700;
  margin-bottom: 4px;
}

.brand {
  text-align: center;
  font-family: 'Playfair Display', serif;
  font-size: 32px;
  font-weight: 700;
  color: var(--dark-ink);
  margin: 0 0 16px 0;
  letter-spacing: -0.5px;
}

.brand span {
  color: var(--primary);
  font-style: italic;
}

.cats {
  display: flex;
  justify-content: center;
  gap: 10px;
  overflow-x: auto;
  padding-bottom: 4px;
}

.cats::-webkit-scrollbar { display: none; }

.cat {
  border: 1px solid var(--glass-border);
  background: #ffffff;
  color: var(--muted-text);
  padding: 10px 22px;
  border-radius: 999px;
  font-weight: 600;
  font-size: 14px;
  white-space: nowrap;
  cursor: pointer;
  transition: all 0.3s ease;
  box-shadow: 0 2px 8px rgba(0,0,0,0.02);
}

.cat:hover {
  background: var(--primary-light);
  color: var(--primary);
  border-color: var(--primary);
}

.cat.active {
  background: var(--primary);
  color: #fff;
  border-color: var(--primary);
  box-shadow: 0 6px 18px rgba(217, 79, 139, 0.3);
}

/* =========================
   ADMIN LOGO
========================= */
.admin-logo {
  position: absolute;
  right: 20px;
  top: 18px;
  width: 44px;
  height: 44px;
  border-radius: 50%;
  background: #ffffff;
  color: var(--primary);
  text-decoration: none;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 20px;
  border: 1px solid var(--glass-border);
  box-shadow: var(--shadow-sm);
  transition: all 0.3s ease;
}

.admin-logo:hover {
  transform: rotate(15deg) scale(1.05);
  box-shadow: 0 8px 20px rgba(217, 79, 139, 0.2);
}

/* =========================
   SEARCH BAR
========================= */
.search-container {
  max-width: 800px;
  margin: 24px auto 10px;
  padding: 0 20px;
}

.search {
  display: block;
  width: 100%;
  padding: 16px 20px;
  border: 1px solid var(--glass-border);
  border-radius: var(--radius-md);
  outline: none;
  font-size: 15px;
  font-family: inherit;
  background: #ffffff;
  box-shadow: var(--shadow-sm);
  transition: all 0.3s ease;
}

.search:focus {
  border-color: var(--primary);
  box-shadow: 0 0 0 4px rgba(217, 79, 139, 0.12);
}

/* =========================
   PRODUCTS GRID & CARDS
========================= */
.grid {
  padding: 24px 20px 60px;
  max-width: 1200px;
  margin: auto;
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
  gap: 24px;
}

.card {
  background: var(--card-bg);
  padding: 14px;
  border-radius: var(--radius-lg);
  border: 1px solid var(--glass-border);
  box-shadow: var(--shadow-sm);
  cursor: pointer;
  transition: all 0.35s cubic-bezier(0.165, 0.84, 0.44, 1);
  position: relative;
  overflow: hidden;
}

.card:hover {
  transform: translateY(-6px);
  box-shadow: var(--shadow-lg);
  border-color: rgba(217, 79, 139, 0.3);
}

.card img {
  width: 100%;
  aspect-ratio: 1;
  object-fit: cover;
  border-radius: var(--radius-md);
  background: var(--primary-light);
  transition: transform 0.5s ease;
}

.card:hover img {
  transform: scale(1.03);
}

.card h3 {
  font-size: 16px;
  font-weight: 700;
  margin: 12px 4px 4px;
  color: var(--dark-ink);
}

.price {
  margin: 0 4px 6px;
  color: var(--primary);
  font-weight: 800;
  font-size: 17px;
}

.product-model {
  font-size: 12px;
  color: var(--muted-text);
  margin: 0 4px 8px;
  line-height: 1.4;
}

.card.sold-out {
  opacity: 0.78;
}

.sold-badge {
  display: inline-block;
  margin-top: 6px;
  padding: 5px 12px;
  border-radius: 999px;
  background: var(--dark-ink);
  color: #fff;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.5px;
}

.empty {
  text-align: center;
  grid-column: 1 / -1;
  padding: 60px 20px;
  color: var(--muted-text);
  font-size: 16px;
}

/* =========================
   MODALS & LIGHTBOX
========================= */
.modal {
  position: fixed;
  inset: 0;
  background: rgba(43, 27, 36, 0.6);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  display: none;
  align-items: center;
  justify-content: center;
  padding: 20px;
  z-index: 100;
  opacity: 0;
  transition: opacity 0.3s ease;
}

.modal.show {
  display: flex;
  opacity: 1;
}

.modalbox {
  background: #ffffff;
  padding: 30px;
  border-radius: 28px;
  width: 100%;
  max-width: 600px;
  max-height: 90vh;
  overflow-y: auto;
  box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
  border: 1px solid var(--glass-border);
  position: relative;
  animation: modalUp 0.35s cubic-bezier(0.165, 0.84, 0.44, 1);
}

@keyframes modalUp {
  from { transform: translateY(20px); opacity: 0; }
  to { transform: translateY(0); opacity: 1; }
}

.close {
  position: absolute;
  top: 20px;
  right: 20px;
  border: none;
  background: var(--primary-light);
  color: var(--primary);
  border-radius: 50%;
  font-size: 20px;
  width: 36px;
  height: 36px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.2s ease;
}

.close:hover {
  background: var(--primary);
  color: #fff;
}

.detail-image {
  display: block;
  width: 260px;
  height: 260px;
  object-fit: contain;
  margin: 0 auto 16px;
  border-radius: var(--radius-md);
  cursor: zoom-in;
  background: var(--primary-light);
  padding: 8px;
}

.gallery {
  display: flex;
  gap: 10px;
  justify-content: center;
  flex-wrap: wrap;
  margin-top: 14px;
}

.gallery img {
  width: 60px;
  height: 60px;
  object-fit: cover;
  border-radius: 10px;
  cursor: pointer;
  border: 2px solid transparent;
  transition: all 0.2s;
}

.gallery img:hover {
  border-color: var(--primary);
  transform: scale(1.05);
}

/* =========================
   FORM & BUTTONS
========================= */
.model {
  border: 1px solid var(--glass-border);
  background: #ffffff;
  color: var(--dark-ink);
  padding: 10px 16px;
  border-radius: var(--radius-md);
  font-weight: 600;
  font-size: 13px;
  margin: 4px;
  cursor: pointer;
  transition: all 0.2s ease;
}

.model.selected {
  background: var(--primary);
  color: #ffffff;
  border-color: var(--primary);
  box-shadow: 0 4px 12px rgba(217, 79, 139, 0.3);
}

.btn {
  width: 100%;
  border: none;
  background: var(--primary);
  color: #ffffff;
  padding: 15px;
  border-radius: var(--radius-md);
  font-weight: 700;
  font-size: 15px;
  cursor: pointer;
  margin-top: 16px;
  box-shadow: 0 6px 20px rgba(217, 79, 139, 0.25);
  transition: all 0.3s ease;
}

.btn:hover {
  background: var(--primary-hover);
  transform: translateY(-1px);
  box-shadow: 0 8px 25px rgba(217, 79, 139, 0.35);
}

.field {
  width: 100%;
  padding: 14px 16px;
  margin: 8px 0;
  border: 1px solid var(--glass-border);
  border-radius: var(--radius-md);
  outline: none;
  font-size: 14px;
  font-family: inherit;
  background: #fafafa;
  transition: all 0.25s ease;
}

.field:focus {
  background: #ffffff;
  border-color: var(--primary);
  box-shadow: 0 0 0 3px rgba(217, 79, 139, 0.1);
}

.summary {
  background: var(--primary-light);
  padding: 16px;
  border-radius: var(--radius-md);
  margin: 12px 0;
  line-height: 1.8;
  font-size: 14px;
}

.total {
  color: var(--primary);
  font-weight: 800;
  font-size: 20px;
}

.ship-options {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
  gap: 10px;
  margin: 10px 0;
}

.ship {
  background: #ffffff;
  border: 1.5px solid var(--glass-border);
  padding: 12px;
  border-radius: var(--radius-md);
  cursor: pointer;
  font-size: 13px;
  font-weight: 600;
  transition: all 0.2s ease;
  display: flex;
  align-items: center;
  gap: 8px;
}

.ship:has(input:checked) {
  border-color: var(--primary);
  background: var(--primary-light);
  color: var(--primary);
}

/* Lightbox */
.lightbox {
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.85);
  backdrop-filter: blur(10px);
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 200;
  padding: 20px;
}

.lightbox.show { display: flex; }
.lightbox img { max-width: 90vw; max-height: 85vh; object-fit: contain; border-radius: var(--radius-md); }

/* Notifications */
.message-success { background: #e6f9f0; color: #1b7a4b; padding: 16px; border-radius: var(--radius-md); margin-top: 14px; font-weight: 600; }
.message-error { background: #fdf0f4; color: #b8235a; padding: 16px; border-radius: var(--radius-md); margin-top: 14px; font-weight: 600; }

@media(max-width: 600px) {
  .brand { font-size: 26px; }
  .grid { grid-template-columns: repeat(2, 1fr); gap: 14px; padding: 14px; }
  .modalbox { padding: 20px; }
}
</style>
</head>

<body>

<header>
  <div class="header-top">Accessoires • Coques • Style</div>
  <h1 class="brand">USTHB <span>Cases</span></h1>
  
  <a href="admin(1).html" class="admin-logo" title="Administration">⚙️</a>

  <nav class="cats">
    <button class="cat active" data-cat="all">✨ Tout voir</button>
    <button class="cat" data-cat="cases">📱 Coques</button>
    <button class="cat" data-cat="accessories">🎀 Accessoires</button>
  </nav>
</header>

<div class="search-container">
  <input id="search" class="search" placeholder="🔍 Rechercher un modèle, une coque, un accessoire..." oninput="render()">
</div>

<main id="products" class="grid">
  <div class="empty">Chargement de la collection...</div>
</main>

<div id="details" class="modal">
  <div class="modalbox">
    <button class="close" onclick="closeDetails()">×</button>
    <div id="detailContent"></div>
  </div>
</div>

<div id="order" class="modal">
  <div class="modalbox">
    <button class="close" onclick="closeOrder()">×</button>
    <h2 style="font-family:'Playfair Display',serif; margin-top:0; color:var(--dark-ink)">🛍️ Valider la commande</h2>
    <div id="orderProduct" class="summary"></div>
    
    <form id="orderForm">
      <input id="firstName" class="field" placeholder="Nom" required>
      <input id="lastName" class="field" placeholder="Prénom" required>
      <input id="phone" class="field" type="tel" inputmode="numeric" pattern="[0-9]{10}" maxlength="10" placeholder="Numéro de téléphone (10 chiffres)" required>
      
      <select id="wilaya" class="field" required>
        <option value="">Sélectionner votre Wilaya</option>
      </select>

      <h3 style="font-size:15px; margin: 16px 0 8px;">📦 Mode de livraison</h3>
      <div class="ship-options">
        <label class="ship"><input type="radio" name="delivery" value="Domicile" required> Domicile</label>
        <label class="ship"><input type="radio" name="delivery" value="Bureau"> Bureau (Stop Desk)</label>
        <label class="ship"><input type="radio" name="delivery" value="USTHB"> USTHB</label>
      </div>

      <textarea id="address" class="field hidden" placeholder="Adresse exacte de livraison..."></textarea>

      <div class="summary">
        Prix produit : <b id="productTotal">0 DA</b><br>
        Frais de livraison : <b id="deliveryCost">—</b><br>
        <hr style="border:0; border-top:1px solid var(--glass-border); margin:8px 0;">
        Montant Total : <span class="total" id="grandTotal">0 DA</span>
      </div>

      <button type="submit" class="btn">✨ Confirmer ma commande</button>
      <div id="orderMsg" class="hidden"></div>
    </form>
  </div>
</div>

<div id="lightbox" class="lightbox" onclick="closeLightbox()">
  <img id="lightImage" src="" alt="Agrandissement">
</div>

<script>
/* =========================
   SUPABASE CLIENT & LOGIQUE
========================= */
const db = supabase.createClient(
  'https://sydurxdeqjgyuzvotmth.supabase.co',
  'sb_publishable_YtZkRYlml5U_6OtOKcnnyQ_smF0CELK'
);

let all = [];
let current = null;
let selectedModel = null;
let activeCat = 'all';

const $ = id => document.getElementById(id);

function esc(str) {
  return String(str ?? '').replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}

function money(v) {
  return Number(v || 0).toLocaleString('fr-DZ') + ' DA';
}

function imgs(v) {
  return String(v || '').split('||').map(x => x.trim()).filter(Boolean);
}

function models(v) {
  return String(v || '').split('||').map(x => x.trim()).filter(Boolean);
}

function category(p) {
  return p?.categorie ? String(p.categorie).toLowerCase().trim() : 'cases';
}

const wilayas = [
  'Adrar', 'Chlef', 'Laghouat', 'Oum El Bouaghi', 'Batna', 'Béjaïa', 'Biskra', 'Béchar', 'Blida', 'Bouira',
  'Tamanrasset', 'Tébessa', 'Tlemcen', 'Tiaret', 'Tizi Ouzou', 'Alger', 'Djelfa', 'Jijel', 'Sétif', 'Saïda',
  'Skikda', 'Sidi Bel Abbès', 'Annabas', 'Guelma', 'Constantine', 'Médéa', 'Mostaganem', 'M’Sila', 'Mascara', 'Ouargla',
  'Oran', 'El Bayadh', 'Illizi', 'Bordj Bou Arreridj', 'Boumerdès', 'El Tarf', 'Tindouf', 'Tissemsilt', 'El Oued', 'Khenchela',
  'Souk Ahras', 'Tipaza', 'Mila', 'Aïn Defla', 'Naâma', 'Aïn Témouchent', 'Ghardaïa', 'Relizane', 'Timimoun', 'Bordj Badji Mokhtar',
  'Ouled Djellal', 'Beni Abbes', 'In Salah', 'In Guezzam', 'Touggourt', 'Djanet', 'El M’Ghair', 'El Meniaa'
];

const domicile = [
  1200,750,800,750,750,750,800,1200,650,750,
  1900,800,750,750,750,500,800,750,750,850,
  750,750,750,750,750,750,750,750,750,850,
  750,850,2000,750,750,750,1600,750,850,750,
  750,650,750,750,850,750,850,750,1400,2000,
  850,1400,1500,2200,1000,2000,1000,1000
];

const desk = [
  800,450,500,450,450,450,500,800,400,450,
  1200,450,450,450,450,300,500,450,450,500,
  450,450,450,450,450,450,450,450,450,550,
  450,550,1200,450,450,450,1000,450,550,450,
  450,400,450,450,550,450,550,450,900,1200,
  550,900,1000,1400,600,1200,600,600
];

wilayas.forEach((w, i) => {
  $('wilaya').insertAdjacentHTML('beforeend', `<option value="${i}">${i + 1} - ${esc(w)}</option>`);
});

async function load() {
  const r = await db.from('coques').select('*').order('created_at', { ascending: false });
  if (r.error) {
    $('products').innerHTML = `<div class="empty">❌ Erreur de chargement des produits.</div>`;
    return;
  }
  all = r.data || [];
  render();
}

function render() {
  const q = $('search').value.toLowerCase().trim();
  const filtered = all.filter(p => {
    const cat = category(p);
    const matchCat = (activeCat === 'all') || (activeCat === 'cases' && cat === 'cases') || (activeCat === 'accessories' && cat !== 'cases');
    const txt = [p.nom, p.modele, p.categorie].join(' ').toLowerCase();
    return matchCat && txt.includes(q);
  });

  if (!filtered.length) {
    $('products').innerHTML = `<div class="empty">Apres recherche : Aucun produit trouvé.</div>`;
    return;
  }

  $('products').innerHTML = filtered.map(p => {
    const firstImage = imgs(p.image_url)[0] || '';
    return `
      <article class="card ${p.epuise ? 'sold-out' : ''}" onclick="openDetails('${esc(p.id)}')">
        <img src="${esc(firstImage)}" alt="${esc(p.nom)}" onerror="this.style.display='none'">
        <h3>${esc(p.nom)}</h3>
        ${p.modele ? `<div class="product-model">📱 ${esc(String(p.modele).replaceAll('||', ' • '))}</div>` : ''}
        <div class="price">${money(p.prix)}</div>
        ${p.epuise ? `<div class="sold-badge">❌ ÉPUISÉ</div>` : ''}
      </article>
    `;
  }).join('');
}

document.querySelectorAll('.cat').forEach(btn => {
  btn.onclick = () => {
    document.querySelectorAll('.cat').forEach(x => x.classList.remove('active'));
    btn.classList.add('active');
    activeCat = btn.dataset.cat;
    render();
  };
});

function openLight(src, e) {
  e?.stopPropagation();
  $('lightImage').
