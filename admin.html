<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panneau d'Administration</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; background-color: #f4f4f9; }
        .container { max-width: 900px; margin: auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        h2 { border-bottom: 2px solid #ccc; padding-bottom: 10px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; }
        input, select, textarea, button { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; }
        button { background-color: #28a745; color: white; border: none; cursor: pointer; font-size: 16px; margin-top: 10px; }
        button:hover { background-color: #218838; }
        .filters { display: flex; gap: 10px; margin-bottom: 15px; }
        .filters select { width: auto; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        th { background-color: #f2f2f2; }
        .badge { padding: 4px 8px; border-radius: 4px; color: white; font-weight: bold; }
        .badge-pending { background-color: #ffc107; color: black; }
        .badge-done { background-color: #28a745; }
        .btn-danger { background-color: #dc3545; }
        .btn-danger:hover { background-color: #bd2130; }
        .btn-secondary { background-color: #17a2b8; }
        .btn-secondary:hover { background-color: #138496; }
    </style>
</head>
<body>

<div class="container">
    <h2>Ajouter un Produit</h2>
    <form id="productForm">
        <div class="form-group">
            <label>Nom du Produit</label>
            <input type="text" id="titre" required>
        </div>
        <div class="form-group">
            <label>Prix (DA)</label>
            <input type="number" id="prix" required>
        </div>
        <div class="form-group">
            <label>Type de produit</label>
            <select id="type" onchange="toggleTypeFields()">
                <option value="coque">Coque</option>
                <option value="accessoire">Accessoire</option>
            </select>
        </div>
        <div class="form-group">
            <label>Image du produit</label>
            <input type="file" id="imageFile" accept="image/*" required>
        </div>
        <div class="form-group" id="stockGroup">
            <label>Stock par Modèle (Format JSON ou Quantité globale)</label>
            <textarea id="stockInput" rows="3" placeholder='{"iPhone 13": 5, "iPhone 14": 10}'></textarea>
        </div>
        <button type="submit">Enregistrer le Produit</button>
    </form>

    <h2>Gestion des Commandes</h2>
    <div class="filters">
        <select id="statusFilter" onchange="renderOrders()">
            <option value="toutes">Toutes les commandes</option>
            <option value="en_attente">En attente</option>
            <option value="traite">Traitées</option>
        </select>
        <button class="btn-secondary" onclick="exportCSV()">Exporter en CSV</button>
    </div>
    <table>
        <thead>
            <tr>
                <th>Date</th>
                <th>Client</th>
                <th>Téléphone</th>
                <th>Wilaya</th>
                <th>Produit / Modèle</th>
                <th>Total</th>
                <th>Statut</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody id="ordersTable"></tbody>
    </table>
</div>

<script>
    const SUPABASE_URL = "VOTRE_SUPABASE_URL";
    const SUPABASE_KEY = "VOTRE_SUPABASE_ANON_KEY";
    const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let allOrders = [];

    async function uploadImage(file) {
        const fileExt = file.name.split('.').pop();
        const fileName = `${Date.now()}.${fileExt}`;
        const { data, error } = await supabase.storage.from('products').upload(fileName, file);
        if (error) throw error;
        const { data: publicUrlData } = supabase.storage.from('products').getPublicUrl(fileName);
        return publicUrlData.publicUrl;
    }

    document.getElementById('productForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        try {
            const file = document.getElementById('imageFile').files[0];
            const imageUrl = await uploadImage(file);
            let stockData = {};
            
            try {
                stockData = JSON.parse(document.getElementById('stockInput').value);
            } catch {
                stockData = { default: parseInt(document.getElementById('stockInput').value) || 0 };
            }

            const { error } = await supabase.from('produits').insert([{
                titre: document.getElementById('titre').value,
                prix: parseFloat(document.getElementById('prix').value),
                type: document.getElementById('type').value,
                image_url: imageUrl,
                stock: stockData
            }]);

            if (error) throw error;
            alert("Produit ajouté avec succès !");
            document.getElementById('productForm').reset();
        } catch (err) {
            alert("Erreur lors de l'ajout : " + err.message);
        }
    });

    async function loadOrders() {
        const { data, error } = await supabase.from('commandes').select('*').order('created_at', { ascending: false });
        if (!error) {
            allOrders = data;
            renderOrders();
        }
    }

    function renderOrders() {
        const filter = document.getElementById('statusFilter').value;
        const tbody = document.getElementById('ordersTable');
        tbody.innerHTML = '';

        const filtered = allOrders.filter(o => filter === 'toutes' || o.statut === filter);

        filtered.forEach(o => {
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td>${new Date(o.created_at).toLocaleDateString()}</td>
                <td>${o.nom} ${o.prenom}</td>
                <td>${o.telephone}</td>
                <td>${o.wilaya}</td>
                <td>${o.produit_nom} (${o.modele || 'N/A'})</td>
                <td>${o.total} DA</td>
                <td><span class="badge ${o.statut === 'traite' ? 'badge-done' : 'badge-pending'}">${o.statut}</span></td>
                <td>
                    <button onclick="toggleStatus('${o.id}', '${o.statut}')">Changer Statut</button>
                    <button class="btn-danger" onclick="deleteOrder('${o.id}')">Supprimer</button>
                </td>
            `;
            tbody.appendChild(tr);
        });
    }

    async function toggleStatus(id, currentStatus) {
        const newStatus = currentStatus === 'en_attente' ? 'traite' : 'en_attente';
        await supabase.from('commandes').update({ statut: newStatus }).eq('id', id);
        loadOrders();
    }

    async function deleteOrder(id) {
        if (confirm("Supprimer cette commande ?")) {
            await supabase.from('commandes').delete().eq('id', id);
            loadOrders();
        }
    }

    function exportCSV() {
        let csv = "Date,Nom,Prenom,Telephone,Wilaya,Produit,Modele,Total,Statut\n";
        allOrders.forEach(o => {
            csv += `"${o.created_at}","${o.nom}","${o.prenom}","${o.telephone}","${o.wilaya}","${o.produit_nom}","${o.modele || ''}","${o.total}","${o.statut}"\n`;
        });
        const blob = new Blob([csv], { type: 'text/csv' });
        const url = window.URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.setAttribute('href', url);
        a.setAttribute('download', 'commandes.csv');
        a.click();
    }

    // Dynamic Realtime update
    supabase.channel('commandes').on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'commandes' }, payload => {
        alert("Nouvelle commande reçue !");
        loadOrders();
    }).subscribe();

    loadOrders();
</script>
</body>
</html>
