```html
<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin — USTHB CASES</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap');

:root{
 --ink:#251c22;
 --muted:#8d7a84;
 --rose:#d84f8b;
 --rose2:#f29abb;
 --soft:#fff0f6;
 --cream:#fffaf8;
 --line:#eedce4;
 --shadow:0 18px 50px rgba(83,38,59,.08)
}

*{box-sizing:border-box}

body{
 margin:0;
 font-family:"DM Sans",Arial,sans-serif;
 background:
 radial-gradient(circle at 5% 0,#fff0f6,transparent 25%),
 var(--cream);
 color:var(--ink)
}

button,input,select,textarea{font:inherit}
button{cursor:pointer;font-weight:800}

.hidden{display:none!important}

.login{
 min-height:100vh;
 display:grid;
 place-items:center;
 padding:20px;
 background:linear-gradient(135deg,#fff7fa,#ffe4ee)
}

.loginBox,.card{
 background:rgba(255,255,255,.94);
 border:1px solid var(--line);
 border-radius:27px;
 box-shadow:var(--shadow)
}

.loginBox{
 width:min(440px,100%);
 padding:34px
}

.logo{
 width:64px;
 height:64px;
 display:grid;
 place-items:center;
 border-radius:20px;
 background:var(--soft);
 font-size:30px
}

.pink{color:var(--rose)}

.field{margin:8px 0}

.field label{
 display:block;
 font-weight:800;
 margin-bottom:6px
}

.field input,
.field select,
.field textarea,
input.search{
 width:100%;
 padding:13px;
 border:1px solid #ebc6d5;
 border-radius:13px;
 outline:none;
 background:#fff
}

.field input:focus,
.field select:focus,
.field textarea:focus{
 border-color:var(--rose2);
 box-shadow:0 0 0 4px #f4a6c51c
}

.primary{
 background:var(--rose);
 color:#fff;
 padding:13px 18px;
 border-radius:13px;
 border:0;
 box-shadow:0 10px 24px #d84f8b2e
}

.secondary{
 background:#fff;
 color:var(--rose);
 border:1px solid #dfa2ba;
 padding:11px 16px;
 border-radius:13px
}

.danger{
 background:#fff0f3;
 color:#b63e63;
 border:1px solid #efb2c4;
 padding:11px 15px;
 border-radius:13px
}

.success{
 background:#e7faed;
 color:#267847;
 border:1px solid #9ad6ae;
 padding:11px 15px;
 border-radius:13px
}

.top{
 position:sticky;
 top:0;
 z-index:30;
 background:rgba(255,250,248,.84);
 backdrop-filter:blur(20px);
 border-bottom:1px solid var(--line)
}

.topin{
 max-width:1280px;
 margin:auto;
 padding:12px 20px;
 display:flex;
 align-items:center;
 gap:20px
}

.brand{
 font-family:"Playfair Display",serif;
 font-size:24px;
 font-weight:700
}

.nav{
 display:flex;
 gap:4px;
 flex:1;
 overflow:auto
}

.nav button{
 background:transparent;
 color:#765666;
 padding:11px 15px;
 border-radius:999px;
 border:0;
 white-space:nowrap
}

.nav button.active{
 background:var(--ink);
 color:#fff
}

.user{
 margin-left:auto;
 white-space:nowrap
}

.main{
 max-width:1280px;
 margin:auto;
 padding:28px 20px
}

.title{
 display:flex;
 justify-content:space-between;
 align-items:center;
 gap:15px;
 margin-bottom:20px
}

.title h1{
 font-family:"Playfair Display",serif;
 font-size:39px;
 margin:0;
 color:var(--ink)
}

.title h2{
 font-family:"Playfair Display",serif;
 margin:0
}

.muted{
 color:var(--muted);
 font-size:13px
}

.stats{
 display:grid;
 grid-template-columns:repeat(4,1fr);
 gap:14px;
 margin-bottom:20px
}

.stat{
 padding:20px
}

.num{
 font-size:32px;
 font-weight:950;
 color:var(--rose);
 margin-top:7px
}

.formGrid{
 display:grid;
 grid-template-columns:1fr 1fr;
 gap:15px
}

.full{
 grid-column:1/-1
}

.drop{
 border:2px dashed #eab1c9;
 border-radius:18px;
 padding:24px;
 text-align:center;
 background:#fff7fa
}

.drop input{
 margin-top:12px
}

.preview{
 display:flex;
 gap:8px;
 flex-wrap:wrap;
 margin-top:10px
}

.preview img{
 width:78px;
 height:78px;
 object-fit:cover;
 border-radius:13px;
 box-shadow:0 8px 20px #63344a18
}

.models{
 display:grid;
 grid-template-columns:repeat(2,1fr);
 gap:7px
}

.modelRow{
 display:flex;
 align-items:center;
 gap:7px;
 background:#fff7fa;
 border:1px solid #efd4df;
 padding:9px;
 border-radius:11px
}

.modelRow input[type=checkbox]{
 width:auto
}

.stock{
 width:72px!important;
 margin-left:auto;
 padding:7px!important
}

.product{
 display:flex;
 align-items:center;
 gap:15px;
 padding:15px 0;
 border-bottom:1px solid #f1e1e8
}

.product:last-child{
 border:0
}

.pimg{
 width:82px;
 height:82px;
 object-fit:cover;
 border-radius:16px
}

.pinfo{
 flex:1
}

.pname{
 font-weight:900;
 font-size:17px
}

.price{
 color:var(--rose);
 font-weight:900;
 margin-top:4px
}

.badge{
 display:inline-block;
 padding:5px 9px;
 border-radius:999px;
 background:var(--soft);
 color:#bd4675;
 font-size:10px;
 letter-spacing:.4px;
 margin-top:6px
}

.actions{
 display:flex;
 gap:7px;
 flex-wrap:wrap
}

.order{
 padding:19px;
 background:#fff;
 border:1px solid var(--line);
 border-left:5px solid var(--rose);
 border-radius:20px;
 margin-bottom:15px;
 box-shadow:0 10px 30px #63344a0b
}

.order.done{
 border-left-color:#4ba66c
}

.orderHead{
 display:flex;
 justify-content:space-between;
 gap:10px
}

.status{
 padding:7px 11px;
 border-radius:99px;
 font-size:11px
}

.pending{
 background:#fff1d9;
 color:#a46b18
}

.doneBadge{
 background:#e5f8eb;
 color:#267847
}

.orderGrid{
 display:grid;
 grid-template-columns:repeat(4,1fr);
 gap:9px;
 margin-top:15px
}

.info{
 background:#fff8fa;
 padding:12px;
 border-radius:12px
}

.label{
 font-size:10px;
 color:#967480;
 font-weight:900;
 margin-bottom:4px
}

.items{
 margin-top:14px;
 padding-top:14px;
 border-top:1px solid #f0dce5
}

.item{
 display:flex;
 align-items:center;
 gap:10px;
 padding:8px 0
}

.item img{
 width:55px;
 height:55px;
 object-fit:cover;
 border-radius:10px
}

.itemInfo{
 flex:1
}

.empty{
 text-align:center;
 padding:50px;
 color:#967580
}

.msg{
 padding:12px;
 border-radius:12px;
 margin-top:10px
}

.msg.ok{
 background:#e7faed;
 color:#267847
}

.msg.err{
 background:#ffe8ef;
 color:#a52f56
}

.search{
 margin:0!important;
 box-shadow:none
}

.card{
 padding:22px;
 margin-bottom:18px
}

@media(max-width:900px){
 .stats{grid-template-columns:repeat(2,1fr)}
 .orderGrid{grid-template-columns:1fr 1fr}
 .topin{flex-wrap:wrap}
 .nav{
  order:3;
  width:100%
 }
 .formGrid{grid-template-columns:1fr}
 .full{grid-column:auto}
}

@media(max-width:600px){
 .main{padding:16px 11px}
 .title h1{font-size:31px}
 .stats{grid-template-columns:1fr 1fr}
 .models{grid-template-columns:1fr}
 .product{flex-wrap:wrap}
 .actions{width:100%}
 .actions button{flex:1}
 .orderGrid{grid-template-columns:1fr}
 .orderHead{flex-direction:column}
 .topin{padding:10px 12px}
 .brand{font-size:20px}
 .user{font-size:12px}
}
</style>
</head>

<body>

 <div class="loginBox">

  </p>

   </div>

   <button class="primary" style="width:100%">
    🔐 Se connecter
   </button>

   <div id="loginMsg"></div>

  </form>

 </div>
</div>


<div id="app" class="hidden">

 <div class="topin">

  <div class="brand">

  </div>

   <button class="active" data-page="products">

   </button>

  </nav>

  <div class="user">
   Admin
   <button class="secondary" onclick="logout()">↪</button>
  </div>

 </div>

</header>

```
